services:
  - type: web
    name: gym-management-api
    runtime: node
    plan: free
    rootDir: Kunwar_Bhosle
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
